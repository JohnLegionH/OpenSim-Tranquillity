# Temporary diagnostic run of chosen Jolt tests on every platform; not for merging.
name: Jolt diagnostics (temporary)
on:
  push:
    branches:
      - side/ci-fix-o8b
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
jobs:
  diag:
    name: Diag ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Tests/OpenSim.Region.PhysicsModules.Jolt.Tests -c Release --disable-build-servers -nodeReuse:false -p:UseSharedCompilation=false
      - name: Run the chosen tests
        run: >
          dotnet test Tests/OpenSim.Region.PhysicsModules.Jolt.Tests -c Release --no-build
          --filter "FullyQualifiedName~TowerSleepDiagnosticTests"
          --logger "console;verbosity=detailed" > "$RUNNER_TEMP/diag.txt" 2>&1; true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-${{ matrix.os }}
          path: ${{ runner.temp }}/diag.txt
