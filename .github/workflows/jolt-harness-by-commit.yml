# Diagnostic: builds the Jolt harness at each listed commit on Windows x64 and runs that commit's own list of
# harness runs, so the commit where a Linux row moved can be read off the uploaded summaries. Runs only on a push to
# its own branch. Records nothing and checks nothing against a baseline.
name: Jolt harness by commit on Windows

on:
  push:
    branches:
      - diag/ci-3-b

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  harness:
    name: Harness at ${{ matrix.short }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - sha: "b180a4d90e7e59a985f3a29aa6df9351c705a708"
            short: "cb180a4d90e"
          - sha: "8a69d5fb3d3650ef26bdac6aa6ba0a70bc1582db"
            short: "c8a69d5fb3d"
          - sha: "c3429e59116e5f1c3394fdf510e4bb85eca810b4"
            short: "cc3429e5911"
          - sha: "cf057630445627a1ded501a89e061c783e522042"
            short: "ccf05763044"
          - sha: "af53fcc5434480834b1298465126f91ca0485266"
            short: "caf53fcc543"
          - sha: "cda806f2687ed7c55970ed923639176957b1af83"
            short: "ccda806f268"
          - sha: "1954f2220bbe87b39ae66a6ebb8d45b74b24bbf3"
            short: "c1954f2220b"
          - sha: "20cd2a2d8a3fc2bd3c3061d2891bafa753d3a40f"
            short: "c20cd2a2d8a"
          - sha: "c31a55c229e2a5e546be4c8120f5265cdb56609b"
            short: "cc31a55c229"
          - sha: "d41c8b054382547b43fca09d2a4dd3dd66475248"
            short: "cd41c8b0543"
          - sha: "0ccd33c7f207682f87084e92a76c6c1c630e8b82"
            short: "c0ccd33c7f2"
          - sha: "560fcda6dbcef0d3e2dc76466911f06908f9b08d"
            short: "c560fcda6db"
          - sha: "e87260236a9580e94b6038e01e39fd4c37b2e80d"
            short: "ce87260236a"
          - sha: "4ff2ec2d39c40f2c76d6643e32ce8b39508b9bc9"
            short: "c4ff2ec2d39"
          - sha: "1bca75e175e2ed4d2dded8f69a43748b015dff57"
            short: "c1bca75e175"
          - sha: "5213c11fe8069ca46d4df79622f2b9d0095c36b5"
            short: "c5213c11fe8"
          - sha: "03132f67598064a14ccb25b34411a8f13e32c75c"
            short: "c03132f6759"
          - sha: "08dabfbdef43d53f5dfe58013cfe0a171db067b4"
            short: "c08dabfbdef"
          - sha: "0fbd531929823adc9299cc69ffcf1cdc1a542038"
            short: "c0fbd531929"
          - sha: "7332f36b4cbb6abbc35766956e5d272c8db0e9d1"
            short: "c7332f36b4c"
          - sha: "52bb44a60be8c2f0a8a2b646317fe18cdc6b0ba3"
            short: "c52bb44a60b"
          - sha: "ecb700371bb24afbcf713256c3d9fc3825fb5e4f"
            short: "cecb700371b"
          - sha: "4220a8e4f04fa40c8761cc4e055faa674e170027"
            short: "c4220a8e4f0"
          - sha: "3a97830531d0bc1d5dcd22293dd430bce7f1d872"
            short: "c3a97830531"
          - sha: "46827cd33f05f6ccbc17a4c59e8656a797aefc50"
            short: "c46827cd33f"
          - sha: "f39fec8e3eaf7538030bd2e8aba65e5c4a57a7d5"
            short: "cf39fec8e3e"
          - sha: "3be43755283e6cbb616c14eacffd17f08a51903f"
            short: "c3be4375528"
          - sha: "d7a9e0cc682aff777f6607f4cc0a239a14e4f7d4"
            short: "cd7a9e0cc68"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the harness
        run: dotnet build Tests/JoltPhysicsHarness -c Release --disable-build-servers -nodeReuse:false -p:UseSharedCompilation=false

      - name: Run the listed harness runs
        run: |
          out="$RUNNER_TEMP/harness"
          mkdir -p "$out"
          dll=Tests/JoltPhysicsHarness/bin/Release/net10.0/JoltPhysicsHarness.dll
          grep -v '^[[:space:]]*#' Tests/JoltPhysicsHarness/ci/runs.txt | grep ':' | while IFS= read -r line; do
            name="${line%%:*}"
            args="${line#*:}"
            case "$name" in *[!A-Za-z0-9_-]*|'') echo "bad run name '$name'"; exit 1;; esac
            echo "::group::$name:$args"
            # shellcheck disable=SC2086
            dotnet "$dll" $args --out "$out/$name" | tee "$out/$name.txt"
            echo "::endgroup::"
          done
          cp Tests/JoltPhysicsHarness/ci/runs.txt "$out/runs.txt"

      - name: Upload the summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-${{ matrix.short }}
          path: ${{ runner.temp }}/harness
          if-no-files-found: ignore
