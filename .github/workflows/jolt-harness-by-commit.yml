# Diagnostic: builds the Jolt harness at each listed commit on Ubuntu x64 and runs that commit's own list of
# harness runs, so the commit where a Linux row moved can be read off the uploaded summaries. Runs only on a push to
# its own branch. Records nothing and checks nothing against a baseline.
name: Jolt harness by commit

on:
  push:
    branches:
      - diag/ci-3-a

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

