# Diagnostic: builds the Jolt harness at each listed commit on Windows x64 and runs that commit's own list of
# harness runs, so the commit where a Linux row moved can be read off the uploaded summaries. Runs only on a push to
# its own branch. Records nothing and checks nothing against a baseline.
name: Jolt harness by commit on Windows

on:
  push:
    branches:
      - diag/ci-3-b

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  harness:
    name: Harness at ${{ matrix.short }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
