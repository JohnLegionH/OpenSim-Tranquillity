# Builds the WebRTC voice addon's test projects and runs their suites on Windows x64 and Linux x64 in Release.
# It runs only when a change touches the voice addon, its tests, the NPC module the voice tests exercise, or this file.
name: Voice tests

on:
  pull_request:
    paths:
      - 'Addons/os-webrtc-janus/**'
      - 'Tests/WebRtcJanusService.Tests/**'
      - 'Tests/WebRtcVoiceRegionModule.Tests/**'
      - 'Source/OpenSim.Region.OptionalModules/World/NPC/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/voice-tests.yml'
  push:
    branches:
      - develop
      - lane/voice
    paths:
      - 'Addons/os-webrtc-janus/**'
      - 'Tests/WebRtcJanusService.Tests/**'
      - 'Tests/WebRtcVoiceRegionModule.Tests/**'
      - 'Source/OpenSim.Region.OptionalModules/World/NPC/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/voice-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run that is still going.
concurrency:
  group: voice-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  VOICE_TEST_PROJECTS: >-
    WebRtcJanusService.Tests
    WebRtcVoiceRegionModule.Tests

jobs:
  test:
    name: Voice suites ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version stamp (Nerdbank.GitVersioning) needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Three of these projects (Visibility, WebRtcVoiceRegionModule and its tests) list their sources by hand
      # (EnableDefaultItems=false), so a .cs file added without a Compile Include is silently left out of the
      # build and, for a test file, of the run. This step compares the .cs files on disk under every voice project
      # with the project's evaluated Compile items.
      - name: Check that every voice source file is compiled
        run: |
          status=0
          while IFS= read -r project; do
            dir=$(dirname "$project")
            compiled=$(dotnet msbuild "$project" -getItem:Compile -nologo \
              | grep -o '"FullPath": *"[^"]*"' \
              | sed -e 's/^"FullPath": *"//' -e 's/"$//' -e 's#\\\\#/#g' \
              | grep -F "/$dir/" | sed "s#.*/$dir/##" | LC_ALL=C sort -u)
            on_disk=$(find "$dir" -name '*.cs' -not -path '*/bin/*' -not -path '*/obj/*' \
              | sed "s#^$dir/##" | LC_ALL=C sort -u)
            missing=$(comm -13 <(printf '%s\n' "$compiled") <(printf '%s\n' "$on_disk"))
            if [ -n "$missing" ]; then
              echo "::error::$project does not compile these files:"
              printf '%s\n' "$missing"
              status=1
            else
              echo "$project: all $(printf '%s\n' "$on_disk" | wc -l) source files are compiled"
            fi
          done < <(find Addons/os-webrtc-janus Tests/WebRtcJanusService.Tests Tests/WebRtcVoiceRegionModule.Tests \
            -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | LC_ALL=C sort)
          exit $status

      - name: Build the voice test projects
        run: |
          for project in $VOICE_TEST_PROJECTS; do
            dotnet build "Tests/$project" -c Release --disable-build-servers -nodeReuse:false -p:UseSharedCompilation=false || exit 1
          done

      - name: Run the voice suites
        run: |
          status=0
          for project in $VOICE_TEST_PROJECTS; do
            dotnet test "Tests/$project" -c Release --no-build \
              --logger "console;verbosity=normal" --logger "trx;LogFileName=$project.trx" \
              --results-directory "$RUNNER_TEMP/voice-results" || status=1
          done
          exit $status

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-results-${{ matrix.os }}
          path: ${{ runner.temp }}/voice-results
          if-no-files-found: ignore
