# Builds the Jolt test project and runs the Jolt suite on Windows x64 and Linux x64, the platforms
# the Jolt module ships its native for, in Debug and Release. Each job also checks the test output
# with assert-patched-joltc.ps1: the patched natives under runtimes/<rid>/native/ and no other joltc.
name: Jolt tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Jolt suite ${{ matrix.os }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
        configuration: [Debug, Release]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version stamp (Nerdbank.GitVersioning) needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the Jolt test project
        run: dotnet build Tests/OpenSim.Region.PhysicsModules.Jolt.Tests -c ${{ matrix.configuration }} --disable-build-servers -nodeReuse:false -p:UseSharedCompilation=false

      - name: Check the natives in the test output
        shell: pwsh
        run: ./Source/OpenSim.Region.PhysicsModules.Jolt/assert-patched-joltc.ps1 -PublishDir Tests/OpenSim.Region.PhysicsModules.Jolt.Tests/bin/${{ matrix.configuration }}/net10.0

      - name: Run the Jolt suite
        run: >
          dotnet test Tests/OpenSim.Region.PhysicsModules.Jolt.Tests -c ${{ matrix.configuration }} --no-build
          --logger "console;verbosity=normal" --logger "trx;LogFileName=jolt.trx"
          --results-directory "$RUNNER_TEMP/jolt-results"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jolt-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: ${{ runner.temp }}/jolt-results
          if-no-files-found: ignore
