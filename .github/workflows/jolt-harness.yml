# Runs the Jolt physics harness on Windows x64 and Linux x64, the platforms the Jolt module ships its native for,
# with the runs listed in Tests/JoltPhysicsHarness/ci/runs.txt, checks their summaries against the baseline recorded
# for the joltc build they loaded (Tests/JoltPhysicsHarness/ci/baselines; a build with none is reported as skipped),
# and uploads each runner's traces, so the two platforms' results can be set side by side, with those of the runs in
# Tests/JoltPhysicsHarness/ci/traced-runs.txt, which are not checked against a baseline. Runs when the Jolt module,
# its backend or vehicles, the harness, that list or this file changes, or by hand. Run by hand with pool_sweep set,
# it runs only the pool sweep job instead.
name: Jolt harness

on:
  push:
    branches:
      - develop
      - lane/jolt
    paths:
      - 'Source/OpenSim.Region.PhysicsModules.Jolt/**'
      - 'Source/OpenSim.Region.PhysicsModules.Jolt.Backend/**'
      - 'Source/OpenSim.Region.PhysicsModules.Jolt.Vehicles/**'
      - 'Tests/JoltPhysicsHarness/**'
      - 'Tests/JoltTestShared/**'
      - '.github/workflows/jolt-harness.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'Source/OpenSim.Region.PhysicsModules.Jolt/**'
      - 'Source/OpenSim.Region.PhysicsModules.Jolt.Backend/**'
      - 'Source/OpenSim.Region.PhysicsModules.Jolt.Vehicles/**'
      - 'Tests/JoltPhysicsHarness/**'
      - 'Tests/JoltTestShared/**'
      - '.github/workflows/jolt-harness.yml'
  workflow_dispatch:
    inputs:
      pool_sweep:
        description: Run only the job pool thread sweep (pool benchmark at 1 to 4 threads) instead of the harness runs
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  harness:
    name: Jolt harness ${{ matrix.os }}
    if: ${{ !inputs.pool_sweep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-22.04-arm, macos-14, windows-11-arm]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version stamp (Nerdbank.GitVersioning) needs the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the harness
        run: dotnet build Tests/JoltPhysicsHarness -c Release --disable-build-servers -nodeReuse:false -p:UseSharedCompilation=false

      - name: Check the natives in the harness output
        shell: pwsh
        run: ./Source/OpenSim.Region.PhysicsModules.Jolt.Backend/assert-joltc-native.ps1 -PublishDir Tests/JoltPhysicsHarness/bin/Release/net10.0

      - name: Run the listed harness runs
        run: |
          out="$RUNNER_TEMP/harness"
          mkdir -p "$out"
          dll=Tests/JoltPhysicsHarness/bin/Release/net10.0/JoltPhysicsHarness.dll
          grep -v '^[[:space:]]*#' Tests/JoltPhysicsHarness/ci/runs.txt | grep ':' | while IFS= read -r line; do
            name="${line%%:*}"
            args="${line#*:}"
            case "$name" in *[!A-Za-z0-9_-]*|'') echo "bad run name '$name'"; exit 1;; esac
            echo "::group::$name:$args"
            # shellcheck disable=SC2086
            dotnet "$dll" $args --out "$out/$name" | tee "$out/$name.txt"
            echo "::endgroup::"
          done

      - name: Check the runs against the baseline for the loaded native
        run: |
          out="$RUNNER_TEMP/harness"
          set +e
          dotnet Tests/JoltPhysicsHarness/bin/Release/net10.0/JoltPhysicsHarness.dll --check-baseline "$out"             --baselines Tests/JoltPhysicsHarness/ci/baselines > "$out/baseline-check.txt"
          rc=$?
          set -e
          cat "$out/baseline-check.txt"
          case "$rc" in
            0) ;;
            3) echo "::notice title=Harness baseline skipped::$(head -n 1 "$out/baseline-check.txt")" ;;
            *) echo "::error title=Harness baseline check failed::$(head -c 1500 "$out/baseline-check.txt" | tr '\n' ' ')"; exit "$rc" ;;
          esac

      # Under traced/, which the check above does not read: these runs have no baseline.
      - name: Run the traced harness runs
        if: always()
        run: |
          out="$RUNNER_TEMP/harness/traced"
          mkdir -p "$out"
          dll=Tests/JoltPhysicsHarness/bin/Release/net10.0/JoltPhysicsHarness.dll
          grep -v '^[[:space:]]*#' Tests/JoltPhysicsHarness/ci/traced-runs.txt | grep ':' | while IFS= read -r line; do
            name="${line%%:*}"
            args="${line#*:}"
            case "$name" in *[!A-Za-z0-9_-]*|'') echo "bad run name '$name'"; exit 1;; esac
            echo "::group::$name:$args"
            # shellcheck disable=SC2086
            dotnet "$dll" $args --out "$out/$name" | tee "$out/$name.txt"
            echo "::endgroup::"
          done

      - name: Upload the traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jolt-harness-${{ matrix.os }}
          path: ${{ runner.temp }}/harness
          if-no-files-found: ignore

  # By hand only (pool_sweep): the pool benchmark with one scene and no light ones, at 1, 2, 3 and 4 job threads, for
  # one awake body, 300 boxes and the test car, at one physics step per heartbeat and at 45 Hz, three passes with the
  # thread order turned each pass. Runner timings are noisy and runners differ: compare the thread counts within one
  # runner's run only.
  pool-sweep:
    name: Jolt pool sweep ${{ matrix.os }}
    if: ${{ inputs.pool_sweep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build the harness
        run: dotnet build Tests/JoltPhysicsHarness -c Release --disable-build-servers -nodeReuse:false -p:UseSharedCompilation=false

      - name: Run the sweep
        run: |
          out="$RUNNER_TEMP/pool-sweep"
          mkdir -p "$out"
          dll=Tests/JoltPhysicsHarness/bin/Release/net10.0/JoltPhysicsHarness.dll
          echo "processors: $(nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")" | tee "$out/processors.txt"
          orders=("1,2,3,4" "3,4,1,2" "2,4,1,3")
          for pass in 1 2 3; do
            for scene in body1 box300 car; do
              case "$scene" in
                body1) args="--heavy-boxes 1" ;;
                box300) args="--heavy-boxes 300" ;;
                car) args="--heavy-car" ;;
              esac
              for rate in 0 45; do
                # shellcheck disable=SC2086
                threads="${orders[$((pass - 1))]}"
                dotnet "$dll" --pool-bench $args --light 0 --rate 11 --physics-rate $rate --threads "$threads" --seconds 10 > "$out/$scene-p$rate-r$pass.csv"
                echo "::group::$scene physics $rate pass $pass"; cat "$out/$scene-p$rate-r$pass.csv"; echo "::endgroup::"
              done
            done
          done

      - name: Upload the sweep
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jolt-pool-sweep-${{ matrix.os }}
          path: ${{ runner.temp }}/pool-sweep
          if-no-files-found: ignore
